
name: CI

on:
  pull_request:
  push:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  no-comments:
    name: no comments in Rust source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject any // or /* in crates/
        run: |
          if grep -rn --include="*.rs" -E "^\s*(//|/\*)" crates/; then
            echo "BLOCKED: comments found in Rust source. Remove them before merging."
            exit 1
          fi

      - name: Reject #[doc] attributes and assert messages
        run: |
          python3 << 'PYEOF'
          import re, sys, pathlib

          def parse_call_args(text, start):
              args, cur, depth, in_str, esc = [], [], 0, False, False
              i = start
              while i < len(text):
                  c = text[i]
                  if esc:
                      cur.append(c); esc = False
                  elif c == '\\' and in_str:
                      cur.append(c); esc = True
                  elif c == '"':
                      cur.append(c); in_str = not in_str
                  elif in_str:
                      cur.append(c)
                  elif c in '([{':
                      depth += 1; cur.append(c)
                  elif c in ')]}':
                      if depth == 0:
                          break
                      depth -= 1; cur.append(c)
                  elif c == ',' and depth == 0:
                      args.append(''.join(cur).strip()); cur = []
                  else:
                      cur.append(c)
                  i += 1
              if cur:
                  args.append(''.join(cur).strip())
              return args

          issues = []
          for path in sorted(pathlib.Path("crates").rglob("*.rs")):
              text = path.read_text(errors="ignore")
              for m in re.finditer(r'#\[doc\s*=', text):
                  line = text[:m.start()].count('\n') + 1
                  issues.append(f"{path}:{line}: #[doc = ...] attribute")
              for m in re.finditer(r'assert(_eq|_ne)?!\s*\(', text):
                  args = parse_call_args(text, m.end())
                  is_eq_ne = '_eq' in m.group() or '_ne' in m.group()
                  msg_idx = 2 if is_eq_ne else 1
                  if len(args) > msg_idx:
                      msg = args[msg_idx]
                      if msg.startswith('"') and ' ' in msg:
                          line = text[:m.start()].count('\n') + 1
                          issues.append(f"{path}:{line}: {m.group().strip()} with message {msg[:50]}")

          if issues:
              for i in issues:
                  print(f"BLOCKED: {i}")
              sys.exit(1)
          PYEOF

  audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dev libs (Ubuntu)
        run: sudo apt-get update -q && sudo apt-get install -y libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check --workspace

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_flags: --workspace --exclude farscry-ocr-coreml
          - os: macos-latest
            test_flags: --workspace
          - os: windows-latest
            test_flags: --workspace --exclude farscry-ocr-coreml
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install MSVC dev tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install X11 dev libs (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev

      - name: Run tests
        run: cargo test ${{ matrix.test_flags }}

  lock-check:
    name: Cargo.lock committed and up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Cargo.lock is up to date
        run: cargo check --locked --workspace
